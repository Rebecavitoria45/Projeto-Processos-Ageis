<div class="tabela-container">
  <table class="tabela-municipios">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Role</th>
        <th>Email</th>
        <th class="acoes-col">Ações</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let municipio of municipios">
        <td>{{ municipio.municipio || municipio.nome }}</td>
        <td>{{ municipio.role }}</td>
        <td>{{ municipio.email }}</td>
        <td class="acoes-cell">
          <button class="btn-acoes btn-ver" (click)="abrirDetalhes(municipio)">Ver Detalhes</button>
        </td>
      </tr>

      <tr *ngIf="municipios.length === 0">
        <td colspan="4" class="sem-dados">Nenhum usuario cadastrado</td>
      </tr>
    </tbody>
  </table>
</div>
