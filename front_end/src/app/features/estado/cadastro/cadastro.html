<app-public-layout>

  <div class="topo">
    <h1 class="titulo-pagina">Gerenciamento de Usuários</h1>
    <p class="subtitulo">Gerencie, edite e cadastre novos usuários do sistema.</p>
  </div>

  <div class="acoes-header">
    <button class="btn-add" (click)="abrirModalCadastro()">+ Cadastrar Novo Usuário</button>
  </div>

  <app-tabela-municipios 
    [municipios]="municipios"
    (verDetalhes)="abrirDetalhes($event)">
  </app-tabela-municipios>

<app-modal-cadastro 
  *ngIf="mostrarModal" 
  [municipio]="municipioSelecionado" 
  (fechar)="fecharModal()" 
  (salvar)="salvarOuAtualizar($event)"
  (deletar)="deletarUsuario($event)">
</app-modal-cadastro>

</app-public-layout>
