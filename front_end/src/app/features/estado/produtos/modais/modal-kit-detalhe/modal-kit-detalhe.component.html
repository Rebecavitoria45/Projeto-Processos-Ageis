<div class="modal-backdrop" (click)="fecharModal()"></div>


<div class="modal-container">
  <div class="modal-content">

    <h2>Detalhes do Kit #{{ kit.kit_id }}</h2>

    <div class="form-row">
      <div class="form-group">
        <label>Tipo do Kit</label>
        <input class="form-control" [(ngModel)]="kit.tipo_kit">
      </div>
      <div class="form-group">
        <label>Quantidade do Kit</label>
        <input type="number" class="form-control" [(ngModel)]="kit.quantidade_kit">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Origem do Kit</label>
          <select class="form-control" [(ngModel)]="kit.origem">
            <option value="compra">Compra</option>
            <option value="doacao">Doação</option>
          </select>
        </div>
      </div>
      
    </div>

    <hr>

    
    <h3>Produtos do Kit</h3>

    <div *ngFor="let p of produtosKit; let i = index" class="produto-item">
      <div class="produto-row">

        <input class="form-control" placeholder="Nome" [(ngModel)]="p.nome_produto">
        <input class="form-control quantidade" type="number" [(ngModel)]="p.quantidade" placeholder="Qtd">
        <input class="form-control validade" type="date" [(ngModel)]="p.data_validade">

        <input class="form-control origem" 
               [value]="p.origem === 'doacao' ? 'Doação' : 'Compra'" 
               readonly style="background:#eee; width:110px; cursor:not-allowed;">
      </div>
    </div>
    
    <button class="btn btn-secondary add-produto" (click)="adicionarProduto()">+ Produto</button>

    <div class="button-group">
      <button class="btn enviar" (click)="salvar()">Salvar</button>
      <button class="btn cancelar" (click)="fecharModal()">Fechar</button>
      <button class="btn deletar" (click)="deletar()">Deletar</button>
    </div>

  </div>
</div>
