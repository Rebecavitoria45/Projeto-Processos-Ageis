<div class="definir-senha-container" *ngIf="!msg">
  <div class="form-wrapper">
    <img src="assets/logo.png" alt="Logo" class="logo-top" />
    <h2>Definir sua senha</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Nova senha</label>
        <input type="password" formControlName="novaSenha" placeholder="Digite sua nova senha" />
      </div>

      <div class="form-group">
        <label>Confirmar senha</label>
        <input type="password" formControlName="confirmarSenha" placeholder="Confirme sua senha" />
      </div>

      <button type="submit" [disabled]="form.invalid">Salvar senha</button>

      <p *ngIf="error" class="erro">{{ error }}</p>
    </form>
  </div>
</div>

<div *ngIf="msg" class="mensagem-sucesso">{{ msg }}</div>
