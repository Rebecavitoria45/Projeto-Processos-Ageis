<div class="modal-overlay">
  <div class="modal-container">

    <h2>Criar Solicitação</h2>

    <form [formGroup]="form">

      <div class="form-group">
        <label>Tipo do Kit</label>

        <div class="radio-group">
          <label *ngFor="let tipo of tiposKit" class="radio-item">
            <input type="radio" formControlName="tipo_kit" [value]="tipo.value">
            {{ tipo.label }}
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>Quantidade Solicitada</label>
        <input type="number" formControlName="quantidade_solicitada" min="1">
      </div>

      <div class="actions">
        <button type="button" class="btn cancelar" (click)="fechar()">Cancelar</button>

        <button
          type="button"
          class="btn salvar"
          (click)="salvar()"
          [disabled]="loading || form.invalid">

          <span *ngIf="!loading">Salvar</span>
          <span *ngIf="loading" class="loader"></span>

        </button>
      </div>

    </form>
  </div>
</div>
